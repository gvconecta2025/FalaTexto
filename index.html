<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FalaTexto</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #171717;
            color: #e3e3e3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
        }
        h1 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        .status {
            font-size: 13px;
            color: #9b9b9b;
            text-align: center;
            margin-bottom: 20px;
            min-height: 20px;
        }
        
        /* Caixa de Texto com transições dinâmicas */
        textarea {
            width: 100%;
            height: 280px;
            background-color: #0d0d0d;
            color: #f3f4f6;
            border: 1px solid #2f2f2f;
            border-radius: 14px;
            padding: 22px;
            font-size: 16px;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: background-color 0.4s ease, color 0.4s ease, border-color 0.3s ease;
            margin-bottom: 20px;
        }
        textarea:focus { border-color: #4f4f4f; }
        
        /* Estado da Caixa quando a IA devolve o texto */
        textarea.ia-delivered {
            background-color: #ffffff !important;
            color: #111111 !important;
            border-color: #e5e7eb;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.05);
        }
        
        /* Controles Principais Modernos */
        .controls-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid #2f2f2f;
        }
        button {
            font-size: 14px;
            font-weight: 500;
            border: 1px solid transparent;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-record {
            padding: 12px 26px;
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 2px 8px rgba(255,255,255,0.1);
        }
        .btn-record:hover:not(:disabled) { background-color: #e2e2e2; transform: translateY(-1px); }
        .btn-record.recording {
            background-color: #ef4444; color: #ffffff; border-color: #ef4444;
            animation: pulse 1.8s infinite; box-shadow: 0 0 12px rgba(239,68,68,0.4);
        }
        .btn-secondary {
            padding: 12px 20px;
            background-color: #212121; color: #b4b4b4; border-color: #2f2f2f;
        }
        .btn-secondary:hover:not(:disabled) { background-color: #2f2f2f; color: #ffffff; }
        
        /* Grupo de IA Modernizado estilo Blocks */
        .ai-group { display: flex; flex-direction: column; gap: 10px; }
        .ai-title {
            font-size: 11px; color: #6b7280; text-transform: uppercase;
            letter-spacing: 1.5px; margin-bottom: 2px; font-weight: 600;
        }
        .btn-ai {
            background-color: #1f2937; color: #f3f4f6; border: 1px solid #374151;
            padding: 14px 20px; border-radius: 12px; text-align: left;
            justify-content: flex-start; font-size: 14px; width: 100%;
        }
        .btn-ai:hover:not(:disabled) {
            background-color: #374151; border-color: #4b5563; transform: translateX(2px);
        }
        .btn-ai:disabled { background-color: #111827; color: #4b5563; border-color: #1f2937; cursor: not-allowed; }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <h1>FalaTexto</h1>
    <div id="statusLabel" class="status">Pronto para gravar</div>
    
    <textarea id="output" placeholder="O texto da sua gravação aparecerá aqui..."></textarea>
    
    <div class="controls-group">
        <button id="recordBtn" class="btn-record">Iniciar Gravação</button>
        <button id="copyBtn" class="btn-secondary">Copiar Texto</button>
        <button id="clearBtn" class="btn-secondary">Limpar</button>
    </div>
    
    <div class="ai-group">
        <div class="ai-title">Processamento Inteligente</div>
        <button id="btnCorrigir" class="btn-ai">✨ 1. Apenas Pontuar e Corrigir</button>
        <button id="btnEstruturar" class="btn-ai">📚 2. Estruturar Texto (Início, Meio e Fim)</button>
    </div>
</div>

<script>
    const recordBtn = document.getElementById('recordBtn');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const btnCorrigir = document.getElementById('btnCorrigir');
    const btnEstruturar = document.getElementById('btnEstruturar');
    const output = document.getElementById('output');
    const statusLabel = document.getElementById('statusLabel');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isRecording = false;
    let finalTranscript = '';

    if (!SpeechRecognition) {
        alert("Seu navegador não suporta reconhecimento de voz.");
    } else {
        recognition = new SpeechRecognition();
        recognition.lang = 'pt-BR';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onresult = (event) => {
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                const fragment = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    finalTranscript += fragment + ' ';
                } else {
                    interimTranscript += fragment;
                }
            }
            output.value = finalTranscript + interimTranscript;
        };

        recordBtn.addEventListener('click', () => {
            // Se a caixa estiver branca (IA já respondeu), limpa tudo para começar um novo texto do zero
            if (output.classList.contains('ia-delivered')) {
                limparTudo();
            }

            if (!isRecording) {
                output.classList.remove('ia-delivered');
                recognition.start();
                isRecording = true;
                statusLabel.textContent = "🎙️ Escutando... Fale livremente.";
                recordBtn.textContent = "Parar Gravação";
                recordBtn.classList.add('recording');
                travarBotoesIA(true);
            } else {
                isRecording = false;
                recognition.stop();
                statusLabel.textContent = "Gravação pausada. Continue gravando ou envie para a IA.";
                recordBtn.textContent = "Continuar Gravação";
                recordBtn.classList.remove('recording');
                travarBotoesIA(false);
            }
        });
    }

    function travarBotoesIA(travar) {
        btnCorrigir.disabled = travar;
        btnEstruturar.disabled = travar;
    }

    btnCorrigir.addEventListener('click', () => enviarParaDeepSeek('corrigir'));
    btnEstruturar.addEventListener('click', () => enviarParaDeepSeek('estruturar'));

    async function enviarParaDeepSeek(modo) {
        const textoBruto = output.value.trim();
        if (!textoBruto) {
            statusLabel.textContent = "⚠️ A caixa de texto está vazia.";
            return;
        }

        statusLabel.textContent = "🧠 Inteligência artificial processando...";
        travarBotoesIA(true);
        recordBtn.disabled = true;

        try {
            const response = await fetch('/api/corrigir', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: textoBruto, modo: modo })
            });

            const data = await response.json();
            
            if (response.ok) {
                output.value = data.correctedText;
                
                // Ativa o fundo branco dinamicamente
                output.classList.add('ia-delivered');
                statusLabel.textContent = modo === 'estruturar' ? "📚 Texto estruturado!" : "✨ Texto pontuado!";
                
                // Zera as variáveis de gravação para o próximo texto começar do zero absoluto
                finalTranscript = '';
                recordBtn.textContent = "Iniciar Gravação";
            } else {
                statusLabel.textContent = "⚠️ Ocorreu um erro: " + data.error;
            }
        } catch (err) {
            statusLabel.textContent = "⚠️ Falha na conexão com os servidores.";
        } finally {
            travarBotoesIA(false);
            recordBtn.disabled = false;
        }
    }

    function limparTudo() {
        output.value = '';
        finalTranscript = '';
        output.classList.remove('ia-delivered');
        statusLabel.textContent = "Pronto para gravar";
        recordBtn.textContent = "Iniciar Gravação";
    }

    clearBtn.addEventListener('click', limparTudo);

    copyBtn.addEventListener('click', () => {
        if (output.value.trim() === "") return;
        output.select();
        document.execCommand('copy');
        const original = copyBtn.textContent;
        copyBtn.textContent = "Copiado!";
        setTimeout(() => copyBtn.textContent = original, 2000);
    });
</script>

</body>
</html>
