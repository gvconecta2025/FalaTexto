<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ditado Inteligente com DeepSeek</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 20px; font-size: 24px; }
        textarea {
            width: 100%;
            height: 220px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: none;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 20px;
            background-color: #fafafa;
        }
        .status { font-size: 14px; color: #666; margin-bottom: 15px; min-height: 20px; }
        .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        button {
            padding: 12px 20px;
            font-size: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: 600;
        }
        .btn-record { background-color: #0076ff; color: white; }
        .btn-record.recording { background-color: #ff3b30; }
        .btn-copy { background-color: #34c759; color: white; }
        .btn-clear { background-color: #8e8e93; color: white; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { opacity: 0.9; }
    </style>
</head>
<body>

<div class="container">
    <h1>Ditado Inteligente (DeepSeek)</h1>
    <div id="statusLabel" class="status">Pronto para iniciar</div>
    <textarea id="output" placeholder="O seu texto transcrito aparecerá aqui..."></textarea>
    
    <div class="btn-group">
        <button id="recordBtn" class="btn-record">Iniciar Gravação</button>
        <button id="copyBtn" class="btn-copy">Copiar Texto</button>
        <button id="clearBtn" class="btn-clear">Limpar</button>
    </div>
</div>

<script>
    const recordBtn = document.getElementById('recordBtn');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const output = document.getElementById('output');
    const statusLabel = document.getElementById('statusLabel');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
        alert("Seu navegador não suporta reconhecimento de voz. Use o Google Chrome.");
    } else {
        const recognition = new SpeechRecognition();
        recognition.lang = 'pt-BR';
        recognition.continuous = true;
        recognition.interimResults = true;

        let isRecording = false;
        let finalTranscript = '';

        recognition.onresult = (event) => {
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                const fragment = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    finalTranscript += fragment + ' ';
                } else {
                    interimTranscript += fragment;
                }
            }
            output.value = finalTranscript + interimTranscript;
        };

        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                // Iniciar Escuta
                output.value = '';
                finalTranscript = '';
                recognition.start();
                isRecording = true;
                statusLabel.textContent = "🎙️ Escutando sua voz... Fale naturalmente.";
                recordBtn.textContent = "Parar e Pontuar";
                recordBtn.classList.add('recording');
            } else {
                // Parar Escuta e Chamar IA
                isRecording = false;
                recognition.stop();
                statusLabel.textContent = "🧠 DeepSeek está analisando e pontuando o texto...";
                recordBtn.disabled = true;

                // Pequeno delay para garantir que o último bloco de fala foi adicionado ao output
                setTimeout(async () => {
                    const textoBruto = output.value.trim();
                    if (!textoBruto) {
                        statusLabel.textContent = "Nenhum texto foi detectado.";
                        recordBtn.disabled = false;
                        recordBtn.textContent = "Iniciar Gravação";
                        recordBtn.classList.remove('recording');
                        return;
                    }
                    await enviarParaDeepSeek(textoBruto);
                }, 500);
            }
        });

        async function enviarParaDeepSeek(texto) {
            try {
                const response = await fetch('/api/corrigir', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: texto })
                });

                const data = await response.json();
                
                if (response.ok) {
                    output.value = data.correctedText;
                    statusLabel.textContent = "✨ Texto pontuado com sucesso!";
                } else {
                    statusLabel.textContent = "⚠️ Erro ao processar: " + data.error;
                }
            } catch (err) {
                statusLabel.textContent = "⚠️ Erro na comunicação com o servidor.";
                console.error(err);
            } finally {
                recordBtn.disabled = false;
                recordBtn.textContent = "Iniciar Gravação";
                recordBtn.classList.remove('recording');
            }
        }

        clearBtn.addEventListener('click', () => {
            finalTranscript = '';
            output.value = '';
            statusLabel.textContent = "Pronto para iniciar";
        });
    }

    copyBtn.addEventListener('click', () => {
        if (output.value.trim() === "") return;
        output.select();
        document.execCommand('copy');
        const original = copyBtn.textContent;
        copyBtn.textContent = "Copiado!";
        setTimeout(() => copyBtn.textContent = original, 2000);
    });
</script>

</body>
</html>
